    <!-- TEMPORARY DEV: remove cached bundles and unregister service workers early -->
    <script>
      (function () {
        try {
          // Run as early as possible to avoid old SW/bundles executing.
          if ("serviceWorker" in navigator || "caches" in window) {
            Promise.all([
              (navigator.serviceWorker &&
              navigator.serviceWorker.getRegistrations
                ? navigator.serviceWorker.getRegistrations()
                : Promise.resolve([])
              ).then(function (regs) {
                return Promise.all(
                  regs.map(function (r) {
                    try {
                      return r.unregister();
                    } catch (e) {
                      return null;
                    }
                  })
                );
              }),
              window.caches && caches.keys
                ? caches.keys().then(function (keys) {
                    return Promise.all(
                      keys.map(function (k) {
                        try {
                          return caches.delete(k);
                        } catch (e) {
                          return null;
                        }
                      })
                    );
                  })
                : Promise.resolve([]),
            ])
              .then(function () {
                // Small delay to make sure unregister has propagated
                setTimeout(function () {
                  try {
                    if (location.search.indexOf("swcleared") === -1)
                      location.replace(
                        location.pathname +
                          location.search +
                          (location.search ? "&" : "?") +
                          "swcleared=1"
                      );
                  } catch (e) {
                    location.reload(true);
                  }
                }, 400);
              })
              .catch(function (err) {
                console.warn("[DEV] SW/caches cleanup failed early", err);
              });
          }
        } catch (e) {
          console.warn("[DEV] SW cleanup threw", e);
        }
      })();
    </script>
    <script type="module">
      // Use helper in client code to inject analytics only when configured.
      import("/src/lib/analytics.ts").then(

          injectUmamiIfConfigured();

    </script>
