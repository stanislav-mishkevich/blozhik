name: Backend CI

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Run cargo fmt check
        working-directory: ./backend
        run: cargo fmt -- --check

      - name: Run cargo clippy
        working-directory: ./backend
        run: cargo clippy -- -D warnings
