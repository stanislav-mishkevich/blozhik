name: Rust CI

on:
  push:
    branches: [main, 001-port-backend]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - name: Install cargo-nextest (optional)
        run: cargo install -q cargo-nextest || true

      - name: Rustfmt check
        run: cargo fmt -- --check
        working-directory: server-rust

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: server-rust

      - name: Run tests
        run: cargo test --workspace --all-features --color always
        working-directory: server-rust
