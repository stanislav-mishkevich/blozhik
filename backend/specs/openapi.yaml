openapi: 3.0.3
info:
  title: Fancy Blog API
  version: 1.0.0
servers:
  - url: /api
paths:
  /posts:
    get:
      summary: List published posts
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search query
        - in: query
          name: tag
          schema:
            type: string
          description: Filter by tag slug
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: A paginated list of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
    post:
      summary: Create a new post (author)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreate"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /posts/{postId}:
    get:
      summary: Get a single post
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /posts/{postId}/comments:
    post:
      summary: Add a comment to a post
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreate"
      responses:
        "201":
          description: Comment created
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
    Post:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        body_markdown:
          type: string
        body_html:
          type: string
        author:
          $ref: "#/components/schemas/User"
        published_at:
          type: string
          format: date-time
    PostCreate:
      type: object
      required: [title, body_markdown]
      properties:
        title:
          type: string
        body_markdown:
          type: string
        tags:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              alt:
                type: string
    PostList:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Post"
    CommentCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
    Comment:
      type: object
      properties:
        id:
          type: integer
        body:
          type: string
        author:
          $ref: "#/components/schemas/User"
        created_at:
          type: string
          format: date-time
